version: '3.8'

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      # Staging Firebase config
      REACT_APP_FIREBASE_API_KEY: ${STAGING_REACT_APP_FIREBASE_API_KEY}
      REACT_APP_FIREBASE_AUTH_DOMAIN: ${STAGING_REACT_APP_FIREBASE_AUTH_DOMAIN}
      REACT_APP_FIREBASE_PROJECT_ID: ${STAGING_REACT_APP_FIREBASE_PROJECT_ID}
      REACT_APP_FIREBASE_STORAGE_BUCKET: ${STAGING_REACT_APP_FIREBASE_STORAGE_BUCKET}
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${STAGING_REACT_APP_FIREBASE_MESSAGING_SENDER_ID}
      REACT_APP_FIREBASE_APP_ID: ${STAGING_REACT_APP_FIREBASE_APP_ID}
      # Test credentials
      REACT_APP_TEST_USER_EMAIL: ${REACT_APP_TEST_USER_EMAIL:-test@example.com}
      REACT_APP_TEST_USER_PASSWORD: ${REACT_APP_TEST_USER_PASSWORD:-test123456}
      TEST_USER_EMAIL: ${REACT_APP_TEST_USER_EMAIL:-test@example.com}
      TEST_USER_PASSWORD: ${REACT_APP_TEST_USER_PASSWORD:-test123456}
      # Playwright config
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      CI: true
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
    env_file:
      - .env
    network_mode: host
